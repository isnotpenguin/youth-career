 [project]
 name = "youth-career-policy-navigator"
 version = "0.1.0"
 description = "Policy PDF RAG pipeline (LangChain + ChromaDB) with metadata-filtered retrieval."
 readme = "README.md"
 requires-python = ">=3.10"
 dependencies = [
   "fastapi>=0.115.0",
   "uvicorn[standard]>=0.30.0",
   "pydantic>=2.7.0",
   "python-dotenv>=1.0.1",
   "langchain>=0.3.0",
   "langchain-community>=0.3.0",
   "langchain-text-splitters>=0.3.0",
   "chromadb>=0.5.0",
   "pypdf>=4.3.0",
   "httpx>=0.27.0",
  "sentence-transformers>=3.0.0",
 ]
 
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "frontend*", "mobile*", ".venv*"]

 [tool.uvicorn]
 factory = false
